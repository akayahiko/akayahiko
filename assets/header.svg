<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-label="akayahiko — Dev and DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".52" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#15112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#94a3b8" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="type1"><rect x="0" y="-22" width="0" height="30">
      <animate attributeName="width" values="0;0;330;330;330" keyTimes="0;.06;.20;.92;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="0" y="-22" width="0" height="30">
      <animate attributeName="width" values="0;0;400;400;400" keyTimes="0;.24;.40;.92;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type3"><rect x="0" y="-22" width="0" height="30">
      <animate attributeName="width" values="0;0;430;430;430" keyTimes="0;.44;.63;.92;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="type4"><rect x="0" y="-22" width="0" height="30">
      <animate attributeName="width" values="0;0;310;310;310" keyTimes="0;.67;.81;.92;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1400" height="390" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="390" rx="26" fill="url(#grid)"/>

  <ellipse cx="120" cy="30" rx="380" ry="270" fill="url(#glowA)" filter="url(#blur)">
    <animate attributeName="cx" values="100;250;100" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="20;95;20" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1260" cy="350" rx="380" ry="250" fill="url(#glowB)" filter="url(#blur)">
    <animate attributeName="cx" values="1280;1120;1280" dur="15s" repeatCount="indefinite"/>
  </ellipse>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="70" y="68" fill="#64748b" font-size="18">~/akayahiko</text>
    <text x="70" y="176" fill="#f8fafc" font-size="76" font-weight="700" letter-spacing="-3">akayahiko</text>

    <rect x="71" y="202" width="518" height="4" rx="2" fill="url(#accent)" filter="url(#softGlow)">
      <animate attributeName="width" values="90;518;518" keyTimes="0;.30;1" dur="2.1s" fill="freeze"/>
    </rect>

    <text x="72" y="254" fill="#cbd5e1" font-size="25">Dev &amp; DevOps Engineer</text>
    <text x="72" y="296" fill="#94a3b8" font-size="19">architecture · cloud · databases · automation</text>
    <text x="72" y="346" fill="#64748b" font-size="17">software + infrastructure, from design to deployment</text>

    <g transform="translate(818,49)">
      <rect width="514" height="292" rx="18" fill="#060912" stroke="#334155" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="6" fill="#fb7185"/>
      <circle cx="49" cy="26" r="6" fill="#facc15"/>
      <circle cx="70" cy="26" r="6" fill="#4ade80"/>
      <text x="98" y="31" fill="#475569" font-size="14">akayahiko@github:~</text>
      <line x1="18" y1="49" x2="496" y2="49" stroke="#1e293b"/>

      <text x="28" y="79" fill="#64748b" font-size="14">$ profile --summary</text>

      <g transform="translate(28 119)">
        <text clip-path="url(#type1)" fill="#67e8f9" font-size="16">role   Dev &amp; DevOps Engineer</text>
      </g>
      <g transform="translate(28 158)">
        <text clip-path="url(#type2)" fill="#c4b5fd" font-size="16">focus  architecture / cloud / databases</text>
      </g>
      <g transform="translate(28 197)">
        <text clip-path="url(#type3)" fill="#f9a8d4" font-size="16">code   Python · C# · C++ · TS/JS · Go · Kotlin</text>
      </g>
      <g transform="translate(28 236)">
        <text clip-path="url(#type4)" fill="#86efac" font-size="16">ship   Docker · Linux · CI/CD</text>
      </g>

      <rect x="293" y="222" width="8" height="18" rx="1" fill="#86efac">
        <animate attributeName="opacity" values="0;0;1;0;1;0;1" keyTimes="0;.79;.81;.86;.91;.96;1" dur="13s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
