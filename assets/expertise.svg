<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="246" viewBox="0 0 1200 246" role="img" aria-label="Engineering areas">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1c"/>
      <stop offset="1" stop-color="#101225"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="246" rx="20" fill="url(#panel)"/>
  <rect x=".75" y=".75" width="1198.5" height="244.5" rx="19.25" fill="none" stroke="#273449" stroke-width="1.5"/>

  <!-- Connections -->
  <path d="M318 123 H441" stroke="#334155" stroke-width="2"/>
  <path d="M759 123 H882" stroke="#334155" stroke-width="2"/>
  <path d="M318 123 H441 M759 123 H882" stroke="url(#path)" stroke-width="3" stroke-linecap="round" stroke-dasharray="34 90" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-248" dur="4.8s" repeatCount="indefinite"/>
  </path>

  <!-- Card 1 -->
  <rect x="35" y="34" width="283" height="178" rx="16" fill="#070c16" stroke="#243247"/>
  <circle cx="67" cy="68" r="6" fill="#22d3ee">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="74" fill="#67e8f9" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">BUILD</text>
  <text x="67" y="112" fill="#e2e8f0" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Python · C# · C++</text>
  <text x="67" y="143" fill="#cbd5e1" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">TypeScript / JavaScript</text>
  <text x="67" y="174" fill="#94a3b8" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Go · Kotlin</text>

  <!-- Card 2 -->
  <rect x="441" y="34" width="318" height="178" rx="16" fill="#070c16" stroke="#2d2f55"/>
  <circle cx="474" cy="68" r="6" fill="#8b5cf6">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" begin=".55s" repeatCount="indefinite"/>
  </circle>
  <text x="491" y="74" fill="#c4b5fd" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">DESIGN</text>
  <text x="474" y="112" fill="#e2e8f0" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Architecture · Cloud</text>
  <text x="474" y="143" fill="#cbd5e1" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Databases · Integration</text>
  <text x="474" y="174" fill="#94a3b8" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Backend · Web systems</text>

  <!-- Card 3 -->
  <rect x="882" y="34" width="283" height="178" rx="16" fill="#070c16" stroke="#3b2748"/>
  <circle cx="914" cy="68" r="6" fill="#f472b6">
    <animate attributeName="opacity" values=".45;1;.45" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="931" y="74" fill="#f9a8d4" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">SHIP</text>
  <text x="914" y="112" fill="#e2e8f0" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Docker · Linux</text>
  <text x="914" y="143" fill="#cbd5e1" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">GitHub Actions · CI/CD</text>
  <text x="914" y="174" fill="#94a3b8" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">Automation · Deployment</text>
</svg>
